<!DOCTYPE html>
<html lang="ID">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Creative Room Nelly</title>
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: #333333;
                color: #fff9e6;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }
            .card {
                background-color: darkgray;
                padding: 30px;
                border-radius: 20px;
                box-shadow: 0 10px 20px rgba(0,0,0,0.05);
                text-align: center;
                max-width: 500px;
                border: 3px dashed #ffb84d;
            }
            h1 {
                color:#333333;
                font-size: 2.5rem;
                margin-bottom: 10px;
            }
            h2 {
                color: #555555;
                font-size: 1.2rem;
                font-weight: normal;
                margin-bottom: 20px;
            }
            p {
                line-height: 1.6;
                color: #666666;
            }
            .badge-container {
                display: flex;
                justify-content: center;
                gap: 10px;
                margin-top: 20px;
            }
            .badge {
                background-color:#555555;
                color: #1890ff;
                padding: 8px 15px;
                border-radius: 15px;
                font-size: 0.85rem;
                font-weight: bold;
            }
            .badge.artist {
                background-color: #fff0f6;
                color: #eb2f96;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Hai Hai</h1>
            <h2>Welcome to My World</h2>
            <p>
                This is my frist try website project. as a digital ilustator i can learn for my another skill! 
            </p>
            <p><i>"Mengubah kanvas kosong menjadi sebuah karya visual dan baris kode.</i></p>
            <div class="badge-container">
                <span class="badge artist">Digital Artist</span>
                <span class="badge">Future Develope</span>
            </div>
        </div>
    </body>
</html>
